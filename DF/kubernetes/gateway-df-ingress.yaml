apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct010-a001-df-generator-httproute
  namespace: ct010-a001-df-v1
spec:
  parentRefs:
    - name: wp-gateway
      namespace: kgateway-system
      sectionName: https  
  hostnames:
    - "tgadev2.toruslowcode.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct010/ag001/a001/v1/api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ct010-a001-df-generator
          port: 443   
    - matches:
        - path:
            type: Exact
            value: /ct010/ag001/a001/v1/api     
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: ct010-a001-df-generator
          port: 443