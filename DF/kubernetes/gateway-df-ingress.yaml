apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ct010-a001-df-generator-virtualservice
  namespace: ct010-a001-df-v1
spec:
  hosts:
    - "tgadev2.toruslowcode.com"
  gateways:
    - istio-system/wp-gateway 
  http:
    - match:
        - uri:
            prefix: /ct010/ag001/a001/v1/api/
      rewrite:
        uri: /
      route:
        - destination:
            host: ct010-a001-df-generator
            port:
              number: 443 
    - match:
        - uri:
            exact: /ct010/ag001/a001/v1/api
      rewrite:
        uri: /
      route:
        - destination:
            host: ct010-a001-df-generator
            port:
              number: 443

