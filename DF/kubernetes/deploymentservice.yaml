
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct010-a001-df-generator
  namespace: ct010-a001-df-v1
  labels:
    app: ct010-a001-df-generator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ct010-a001-df-generator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ct010-a001-df-generator
    spec:
      containers:
      - name: ct010-a001-df-generator-backend-container
        image: 192.168.2.164:5000/ct010-a001-df-v1:docker_tag
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: redis_host
          value: "192.168.2.192"
        - name: redis_port
          value: "32055"

---
apiVersion: v1
kind: Service
metadata:
  name: ct010-a001-df-generator
  namespace: ct010-a001-df-v1
  labels:
    app: ct010-a001-df-generator
spec:
  selector:
    app: ct010-a001-df-generator
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    - name: https
      protocol: TCP
      port: 443
      targetPort: 3000
  type: ClusterIP