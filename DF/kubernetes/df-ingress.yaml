apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a001-df-v1-ingress
  namespace: a001-df-v1
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tgadev.gsstvl.com
      secretName: a001-df-v1-tls
  rules:
    - host: tgadev.gsstvl.com
      http:
        paths:
          - path: /ct266/ag001/a001/v1/api-int(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: a001-df-generator
                port:
                  number: 443