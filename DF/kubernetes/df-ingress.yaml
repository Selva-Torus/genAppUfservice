apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct242-tpptest002-df-v2-ingress
  namespace: ct242-tpptest002-df-v2
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tgadev.toruslowcode.com
      secretName: ct242-tpptest002-df-v2-tls
  rules:
    - host: tgadev.toruslowcode.com
      http:
        paths:
          - path: /ct242/tpptest001/tpptest002/v2/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ct242-tpptest002-df-generator
                port:
                  number: 443