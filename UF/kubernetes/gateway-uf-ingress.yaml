apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct010-a001-uf-generator-httproute
  namespace: ct010-a001-uf-v1
spec:
  parentRefs:
    - name: wp-gateway
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - "tgadev2.toruslowcode.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct010/ag001/a001/v1
      backendRefs:
        - name: ct010-a001-uf-generator
          port: 443