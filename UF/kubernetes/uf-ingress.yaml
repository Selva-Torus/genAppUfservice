apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ct010-a001-uf-generator-virtualservice
  namespace: ct010-a001-uf-v1
spec:
  hosts:
    - "tgadev2.toruslowcode.com"
  gateways:
    - istio-system/wp-gateway
  http:
    - match:
        - uri:
            prefix: /ct010/ag001/a001/v1
      route:
        - destination:
            host: ct010-a001-uf-generator
            port:
              number: 443 
    - match:
        - uri:
            prefix: /ct010/ag001/a001/v1
      rewrite:
        uri: /
      route:
        - destination:
            host: ct010-a001-uf-generator
            port:
              number: 443
 
 