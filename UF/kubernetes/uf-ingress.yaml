apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct242-tpptest002-uf-v2-ingress
  namespace: ct242-tpptest002-uf-v2
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tgadev.toruslowcode.com
      secretName: ct242-tpptest002-uf-v2-tls
  rules:
    - host: tgadev.toruslowcode.com
      http:
        paths:
          - path: /ct242/tpptest001/tpptest002/v2
            pathType: Prefix
            backend:
              service:
                name: ct242-tpptest002-uf-generator
                port:
                  number: 443